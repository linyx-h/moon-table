plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "cn.moontable.game"
    compileSdk 35
    defaultConfig {
        applicationId "cn.moontable.game"
        minSdk 24
        targetSdk 35
        versionCode 18
        versionName "1.17"
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("MOON_KEYSTORE") ?: "../../.android-signing.jks")
            storePassword System.getenv("MOON_SIGN_PASSWORD")
            keyAlias "moontable"
            keyPassword System.getenv("MOON_SIGN_PASSWORD")
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir("generated/web")
    packaging { jniLibs { useLegacyPackaging = false } }
}

chaquopy {
    defaultConfig {
        version = "3.10"
        if (System.getenv("MOON_BUILD_PYTHON")) buildPython(System.getenv("MOON_BUILD_PYTHON"))
        pip {
            // Python 依赖只维护一份，避免构建配置与源码要求不同步。
            install "-r", project.file("../../requirements.txt").absolutePath
        }
    }
    sourceSets.main.srcDir layout.buildDirectory.dir("generated/python")
}

tasks.register("syncPython", Sync) {
    from "../.."
    include "game.py", "catalog.py", "role_skills.py", "android_server.py"
    into layout.buildDirectory.dir("generated/python")
}
tasks.register("syncWeb", Sync) {
    from "../../web/dist"
    into layout.buildDirectory.dir("generated/web/web")
}
tasks.named("preBuild").configure { dependsOn "syncPython", "syncWeb" }
tasks.matching { it.name.contains("Python") && it.name != "syncPython" }.configureEach { dependsOn "syncPython" }
