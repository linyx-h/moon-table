name: Build desktop
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "已有 Release 的标签，留空时仅上传构建产物"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements-desktop.txt
      - run: python build_desktop.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: MoonTable-${{ runner.os }}
          path: dist/*.zip
      - name: Upload to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$env:RELEASE_TAG" dist/*.zip --clobber
        shell: pwsh
