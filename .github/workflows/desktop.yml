name: Build desktop
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "已有 Release 的标签，留空时仅上传构建产物"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  desktop:
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements-desktop.txt
      - run: python -m unittest discover -s tests -v
      - run: python build_desktop.py --output dist
      - name: Check packaged Windows service
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive dist/MoonTable-Windows.zip "$env:RUNNER_TEMP/moon-smoke"
          $p = Start-Process "$env:RUNNER_TEMP/moon-smoke/MoonTable/MoonTable.exe" -ArgumentList "--check", "--data-dir", "$env:RUNNER_TEMP/moon-check-data" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged service check failed: $($p.ExitCode)" }
      - name: Check packaged Mac service
        if: runner.os == 'macOS'
        run: |
          unzip -q dist/MoonTable-macOS-*.zip -d "$RUNNER_TEMP/moon-smoke"
          "$RUNNER_TEMP/moon-smoke/MoonTable.app/Contents/MacOS/MoonTable" --check --data-dir "$RUNNER_TEMP/moon-check-data"
      - uses: actions/upload-artifact@v4
        with:
          name: MoonTable-${{ runner.os }}
          path: dist/*.zip
      - name: Upload to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$env:RELEASE_TAG" dist/*.zip --clobber
        shell: pwsh
